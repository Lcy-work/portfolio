<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析仪表盘 | ChargeIQ</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Microsoft YaHei',sans-serif; background:#0a0e17; color:#e2e8f0; min-height:100vh; }
.header { background:linear-gradient(180deg,#0f172a 0%,#0a0e17 100%); border-bottom:1px solid #1e3a5f; padding:16px 32px; display:flex; align-items:center; gap:16px; }
.header a { color:#00d4ff; text-decoration:none; font-size:14px; transition:color .2s; }
.header a:hover { color:#f59e0b; }
.header h2 { font-size:20px; color:#e2e8f0; }
.container { max-width:1300px; margin:24px auto; padding:0 16px; }
.chart-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(500px, 1fr)); gap:16px; }
.chart-card { background:#111827; border:1px solid #1e293b; border-radius:12px; padding:24px; }
.chart-card h3 { font-size:16px; color:#00d4ff; margin-bottom:16px; }
.chart-box { width:100%; height:400px; }
.stats-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px; }
.stat-card { background:#111827; border:1px solid #1e293b; border-radius:12px; padding:20px; text-align:center; }
.stat-card .num { font-size:32px; font-weight:800; color:#00d4ff; font-family:'Orbitron',monospace; }
.stat-card .label { font-size:13px; color:#94a3b8; margin-top:4px; }
@media (max-width:640px) { .stats-row { grid-template-columns:repeat(2,1fr); } .chart-grid { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="header">
    <a href="/">← 返回首页</a>
    <h2 id="viewTitle">数据分析仪表盘</h2>
</div>
<div class="container">
    <div class="stats-row" id="statsRow"></div>
    <div class="chart-grid">
        <div class="chart-card"><h3 id="chart1Title">数据视图</h3><div class="chart-box" id="chart1"></div></div>
        <div class="chart-card" id="chart2Card"><h3 id="chart2Title">分布视图</h3><div class="chart-box" id="chart2"></div></div>
    </div>
</div>

<script>
const view = new URLSearchParams(location.search).get('view') || 'v1';
const titles = {
    v1: ['平均组电压与充电电流','组电压趋势','充电电流趋势'],
    v2: ['最高/最低单体电压','单体电压极值对比',''],
    v3: ['每时电池平均SOC','SOC小时趋势','SOC分布'],
    v4: ['充电时间与次数频率','充电频率分布','频率占比'],
    v5: ['充电时间分布','充电时长分段统计','时段占比'],
    v6: ['平均充电速率','充电速率趋势','速率对比']
};
document.getElementById('viewTitle').textContent = titles[view][0];

// ECharts dark theme colors
const chartTextColor = '#94a3b8';
const chartLineColor = '#1e293b';

function loadChart(url, chartId, xKey, yKey, title, chartType) {
    fetch(url).then(r=>r.json()).then(data=>{
        if (!data || data.length === 0) { console.warn('No data for '+chartId); return; }
        var dom = document.getElementById(chartId);
        dom.style.visibility = 'visible';
        var chart = echarts.init(dom);
        var colors = ['#00d4ff','#f59e0b','#10b981','#ef4444','#a259f4','#f97316','#06b6d4','#84cc16'];
        var option;
        if (chartType === 'pie') {
            option = {
                title:{text:title,left:'center',textStyle:{fontSize:14,color:'#e2e8f0'}},
                tooltip:{trigger:'item',formatter:'{b}: {c} ({d}%)'},
                series:[{type:'pie',radius:['40%','70%'],center:['50%','55%'],
                    data: data.map(function(d){ return {name:d[xKey],value:parseFloat(d[yKey])}; }),
                    label:{formatter:'{b}\n{d}%',color:'#94a3b8',fontSize:11},
                    itemStyle:{borderRadius:4,borderColor:'#111827',borderWidth:2},
                    color:colors}]
            };
        } else {
            var x = data.map(function(d){ return d[xKey]; });
            var y = data.map(function(d){ return parseFloat(d[yKey]); });
            option = {
                title:{text:title,left:'center',textStyle:{fontSize:14,color:'#e2e8f0'}},
                tooltip:{trigger:'axis'},
                grid:{top:40,right:20,bottom:30,left:50},
                xAxis:{type:'category',data:x,axisLabel:{color:chartTextColor,fontSize:11},axisLine:{lineStyle:{color:chartLineColor}}},
                yAxis:{type:'value',axisLabel:{color:chartTextColor,fontSize:11},splitLine:{lineStyle:{color:chartLineColor}}},
                series:[{data:y,type:chartType||'line',smooth:true,
                    areaStyle:chartType === 'bar' ? undefined : {opacity:0.15,color:colors[0]},
                    itemStyle:{color:colors[0]},
                    lineStyle:chartType === 'bar' ? undefined : {color:colors[0]}}]
            };
        }
        chart.setOption(option);
        window.addEventListener('resize',function(){ chart.resize(); });
    }).catch(function(e){ console.error('Chart load error:',e); });
}

// Chart1: all views
var apiMap = {
    v1:['/api/v1/voltage_current','chart1','record_time','avg_pack_voltage','组电压(V)','line'],
    v2:['/api/v2/cell_voltage','chart1','voltage_type','voltage_value','单体电压(V)','bar'],
    v3:['/api/v3/hourly_soc','chart1','record_hour','avg_soc','SOC(%)','line'],
    v4:['/api/v4/charge_frequency','chart1','charge_hour','charge_count','充电次数','bar'],
    v5:['/api/v5/charge_time_dist','chart1','time_range','session_count','会话数','bar'],
    v6:['/api/v6/charge_rate','chart1','record_hour','avg_charge_rate','速率(kW/h)','line']
};
var cfg = apiMap[view];
if (cfg) loadChart(cfg[0], cfg[1], cfg[2], cfg[3], cfg[4], cfg[5]);

// Chart2: all views except v2 (only 2 data points)
var apiMap2 = {
    v1:['/api/v1/voltage_current','chart2','record_time','avg_charge_current','充电电流(A)','line'],
    v3:['/api/v3/hourly_soc','chart2','record_hour','avg_soc','SOC分布(%)','bar'],
    v4:['/api/v4/charge_frequency','chart2','charge_hour','frequency_ratio','频率占比','bar'],
    v5:['/api/v5/charge_time_dist','chart2','time_range','session_count','时段占比','pie'],
    v6:['/api/v6/charge_rate','chart2','record_hour','avg_charge_rate','速率对比(kW/h)','bar']
};
var cfg2 = apiMap2[view];
if (cfg2) {
    document.getElementById('chart2Title').textContent = titles[view][2];
    loadChart(cfg2[0], cfg2[1], cfg2[2], cfg2[3], cfg2[4], cfg2[5]);
} else {
    document.getElementById('chart2Card').style.display = 'none';
}

// Stats cards
fetch('/api/v7/performance_index').then(function(r){ return r.json(); }).then(function(data){
    if (!data || data.length === 0) return;
    var totalSessions = data.reduce(function(s,d){ return s + parseInt(d.session_count); },0);
    var totalKwh = Number(data.reduce(function(s,d){ return s + parseFloat(d.total_kwh); },0)).toFixed(0);
    var totalFees = Number(data.reduce(function(s,d){ return s + parseFloat(d.total_fees); },0)).toFixed(0);
    var stationCount = data.length;
    document.getElementById('statsRow').innerHTML =
        '<div class="stat-card"><div class="num">' + stationCount + '</div><div class="label">充电站数量</div></div>' +
        '<div class="stat-card"><div class="num">' + totalSessions + '</div><div class="label">总会话数</div></div>' +
        '<div class="stat-card"><div class="num">' + totalKwh + '</div><div class="label">总充电量(kWh)</div></div>' +
        '<div class="stat-card"><div class="num">&yen;' + totalFees + '</div><div class="label">总费用</div></div>';
});
</script>
</body>
</html>
